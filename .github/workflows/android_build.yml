name: Build Signed Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_android:
    name: Build Signed Android AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/smartgps-release.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=smartgps" >> android/key.properties
          echo "storeFile=smartgps-release.jks" >> android/key.properties

      - name: Build Signed AAB (Play Store)
        run: flutter build appbundle --release

      - name: Build Signed APK
        run: flutter build apk --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Smart_GPS_Signed_AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart_GPS_Signed_APK
          path: build/app/outputs/flutter-apk/app-release.apk
