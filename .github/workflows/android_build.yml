name: Build Signed Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_android:
    name: Build Signed Android AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        # Java 21: the MapLibre map plugin (free OpenFreeMap) is compiled for Java 21 and fails on 17
        # ("invalid source release: 21"). The app itself still targets Java 17 bytecode.
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # Catch Dart errors here rather than after Gradle has spent six minutes getting to them.
      # Infos and warnings stay non-fatal; only real errors stop the build.
      - name: Analyze (errors fail the build, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/smartgps-release.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=smartgps" >> android/key.properties
          echo "storeFile=smartgps-release.jks" >> android/key.properties

      # The Google Maps API key (official Google map) comes from the GOOGLE_MAPS_API_KEY secret. Gradle puts it
      # into the manifest; --dart-define tells the app it has one. Without the secret the app is built exactly
      # as before and simply uses the other maps.
      - name: Build Signed AAB (Play Store)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          DEFINE=""
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then DEFINE="--dart-define=GMAPS_KEY_PRESENT=true"; echo "Google Maps key: present"; else echo "Google Maps key: not set"; fi
          flutter build appbundle --release $DEFINE

      - name: Build Signed APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          DEFINE=""
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then DEFINE="--dart-define=GMAPS_KEY_PRESENT=true"; fi
          flutter build apk --release $DEFINE

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Smart_GPS_Signed_AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart_GPS_Signed_APK
          path: build/app/outputs/flutter-apk/app-release.apk
