name: Generate iOS CSR

on:
  workflow_dispatch:

jobs:
  generate-csr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Private Key and CSR
        run: |
          openssl genrsa -out ios_distribution.key 2048
          openssl req -new -key ios_distribution.key -out ios_distribution.csr -subj "/emailAddress=jbharwana34@icloud.com/CN=Smart Step Transportation/C=QA"

      - name: Base64 encode private key
        run: |
          echo "=== PRIVATE KEY (BASE64) - Save this as GitHub Secret: IOS_DISTRIBUTION_KEY_BASE64 ==="
          base64 -w 0 ios_distribution.key
          echo ""
          echo "=== END ==="

      - name: Upload CSR
        uses: actions/upload-artifact@v4
        with:
          name: ios-csr
          path: ios_distribution.csr

      - name: Upload Private Key (download and delete immediately!)
        uses: actions/upload-artifact@v4
        with:
          name: ios-private-key-DELETE-AFTER-DOWNLOAD
          path: ios_distribution.key
          retention-days: 1
