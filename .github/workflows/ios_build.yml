name: Build iOS IPA

# Two modes.
#
#   Without signing secrets  -> an UNSIGNED .ipa. Useful to prove the code compiles on iOS, and
#                               nothing else. App Store Connect refuses unsigned uploads, so this
#                               artifact can never be submitted. This is what the workflow did
#                               before, and why the IPA it produced could not be used.
#
#   With signing secrets     -> a signed .ipa built through xcodebuild's own export step, which is
#                               the only output App Store Connect accepts.
#
# Required secrets for the signed path (add under Settings -> Secrets and variables -> Actions):
#   IOS_DIST_CERT_P12_BASE64   base64 of the .p12 distribution certificate exported from Keychain
#   IOS_DIST_CERT_PASSWORD     the password set when exporting that .p12
#   IOS_PROVISIONING_PROFILE_BASE64
#                              base64 of the App Store provisioning profile (.mobileprovision)
#   IOS_TEAM_ID                the 10-character Apple Team ID
#
#   Generate the base64 on your own machine, never in a workflow:
#       base64 -i cert.p12 | pbcopy            (macOS)
#       certutil -encode cert.p12 out.txt      (Windows)
#
# Optional, to send the build straight to App Store Connect / TestFlight (no Mac needed):
#   APP_STORE_CONNECT_KEY_ID      Key ID of an App Store Connect API key (Users and Access -> Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown on the same page
#   APP_STORE_CONNECT_API_KEY     full text of the downloaded AuthKey_XXXXXXXXXX.p8 file
#   With these set, every push uploads the signed build to App Store Connect (TestFlight).
#   Apple accepts each build number once: a push that did not bump the version in pubspec.yaml
#   gets a warning, not a failed build. Releasing to users is still done by hand in App Store Connect.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect (TestFlight)"
        type: boolean
        default: true

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze (errors fail the build, warnings do not)
        # NO "|| true". Swallowing the exit code cost a two-minute build and a badly misleading
        # error: four Dart errors (an undefined field and an undefined variable) let this step pass,
        # the Xcode build then failed, and Flutter's diagnostic guessed at the cause and printed
        # "requires a selected Development Team" - sending us after a signing problem that did not
        # exist. The flags keep infos and warnings non-fatal, so only genuine errors stop the build,
        # and they stop it in eight seconds with the file and line printed.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ---- signed path ------------------------------------------------------------------------
      - name: Are signing secrets present?
        id: signing
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "available=true" >> "$GITHUB_OUTPUT";
          else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain with a random password, unlocked only for this job. Nothing is
          # written to the default login keychain and the runner is destroyed afterwards.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$CERT_B64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

          # Install the profile under its own UUID, which is the filename Xcode looks for.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > profile.mobileprovision
          PLIST_XML="$(security cms -D -i profile.mobileprovision)"
          echo "$PLIST_XML" > profile.plist
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)"
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          rm -f profile.mobileprovision profile.plist

          # The profile's name is what xcodebuild matches on, and it is not something worth making
          # into another secret when the profile already carries it.
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME"

      - name: Build signed IPA
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail

          # MANUAL signing, not automatic. Automatic signing asks Apple to issue or refresh the
          # certificate on the fly, which needs an App Store Connect API key and an Apple ID
          # session - neither exists on a fresh runner, so it fails with an unhelpful
          # "No signing certificate found". The certificate and profile are already installed
          # above, so tell Xcode to use exactly those and nothing else.
          cat >> ios/Flutter/Release.xcconfig <<XCCONFIG

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = Apple Distribution
          XCCONFIG

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ios/Runner/Info.plist 2>/dev/null || echo 'com.smartstep.gps')"
          if [ "$BUNDLE_ID" = "\$(PRODUCT_BUNDLE_IDENTIFIER)" ]; then BUNDLE_ID="com.smartstep.gps"; fi

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Confirm the IPA is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          IPA="$(ls build/ios/ipa/*.ipa | head -n 1)"
          echo "checking $IPA"
          mkdir -p /tmp/ipacheck && unzip -q -o "$IPA" -d /tmp/ipacheck
          APP="$(ls -d /tmp/ipacheck/Payload/*.app | head -n 1)"
          # A signature that does not verify means App Store Connect will reject the upload, and
          # finding that out here costs seconds instead of a round trip through Apple.
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n '1,12p'
          codesign --verify --deep --strict "$APP" && echo "SIGNATURE VALID"
          test -f "$APP/PrivacyInfo.xcprivacy" \
            && echo "PrivacyInfo.xcprivacy is in the bundle" \
            || { echo "::error::PrivacyInfo.xcprivacy is MISSING from the bundle"; exit 1; }

      - name: Upload signed IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Smart_Step_GPS_iOS_SIGNED
          path: build/ios/ipa/*.ipa

      - name: Upload to App Store Connect
        if: steps.signing.outputs.available == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY" ]; then
            echo "::warning::Not uploaded: add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_API_KEY secrets."
            exit 0
          fi
          # altool looks for the key in ~/private_keys/AuthKey_<KEY_ID>.p8.
          mkdir -p ~/private_keys
          # Accept the raw .p8 text, or the "key" value copied from a JSON key file, where line
          # breaks are written as \n and the value may still have its quotes and trailing comma.
          printf '%s\n' "$API_KEY" | perl -pe 's/\x5Cn/\n/g; s/^[ \t]*"//; s/"[ \t]*,?[ \t]*$//' > ~/private_keys/AuthKey_${KEY_ID}.p8
          grep -q "BEGIN PRIVATE KEY" ~/private_keys/AuthKey_${KEY_ID}.p8 \
            || { echo "::error::APP_STORE_CONNECT_API_KEY does not look like a .p8 private key"; exit 1; }
          IPA="$(ls build/ios/ipa/*.ipa | head -n 1)"
          set +e
          OUT="$(xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1)"
          CODE=$?
          set -e
          rm -f ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "Uploaded. The build appears in App Store Connect -> TestFlight after Apple processes it (10-30 min)."
          elif echo "$OUT" | grep -qiE "previously uploaded|already been (used|uploaded)|DUPLICATE|must be higher|must contain a higher"; then
            echo "::warning::Not uploaded: this build number is already in App Store Connect. Bump version in pubspec.yaml (e.g. 1.0.6+9) for a new upload."
          else
            echo "::error::Upload to App Store Connect failed - see the output above."
            exit 1
          fi

      # ---- unsigned path ----------------------------------------------------------------------
      - name: Build unsigned app (compile check only)
        if: steps.signing.outputs.available != 'true'
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Smart_Step_GPS_UNSIGNED.ipa Payload

      - name: Upload unsigned IPA
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Smart_Step_GPS_iOS_UNSIGNED
          path: Smart_Step_GPS_UNSIGNED.ipa

      - name: Explain the unsigned result
        if: steps.signing.outputs.available != 'true'
        run: |
          echo "::warning::This IPA is UNSIGNED and cannot be uploaded to App Store Connect."
          echo "::warning::Add the IOS_DIST_* secrets listed at the top of this workflow to get a submittable build."
