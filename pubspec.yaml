name: smart_step_gps
description: Smart Step GPS Mobile App for Parents and Monitors

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.1
  geolocator: ^10.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
# Launcher icons. The source art is the monogram ALONE, pre-padded, not the full logo: the wordmark
# is three lines of type that are unreadable at 48dp and get clipped by every circular launcher mask.
# tool/icon/ is outside the bundled assets, so this artwork is not shipped inside the APK.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 24
  image_path: "tool/icon/icon_legacy.png"
  adaptive_icon_background: "#F0F4F8"
  adaptive_icon_foreground: "tool/icon/icon_foreground.png"
  # App Store Connect refuses any build whose icons carry an alpha channel, and it refuses it at
  # upload, before review. Every iOS icon in this project had one. This flag makes the generator
  # flatten them, so re-running it can never put the problem back.
  remove_alpha_ios: true
