name: smart_step_gps
description: Smart Step GPS Mobile App for Parents and Monitors

publish_to: 'none'

# The number after + is the BUILD number (CFBundleVersion). Apple refuses any upload whose build
# number is not higher than one already accepted, and build 1 has been used. Bump this before every
# upload; the version before + only changes when the release itself changes.
version: 1.0.6+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.1
  geolocator: ^10.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  flutter_map: ^8.3.2
  # Offline English map of Qatar (see tool/map/README.md). vector_map_tiles is pinned to the 9.x
  # pre-release because it is the first line that supports flutter_map 8; the stable 8.0.0 needs
  # flutter_map 7. Pinned exactly so a new beta cannot change behaviour under a store build.
  # The PMTiles archive is read by lib/services/pmtiles_reader.dart rather than the pmtiles
  # package: pmtiles 2.x needs protobuf 6 where vector_map_tiles needs 3, and pmtiles 1.x needs
  # latlong2 0.9 where flutter_map 8 needs 0.10, so neither line can be installed alongside.
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: ^6.1.0   # Theme / ThemeReader for the map style
  path_provider: ^2.1.5
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  # lib/screens/privacy_screen.dart imports this. It only worked because some other package happened
  # to pull it in; the moment that package dropped it, the build would have failed with "Target of
  # URI doesn't exist" and nothing here would explain why. Declare what you import.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/map/
# Launcher icons. The source art is the monogram ALONE, pre-padded, not the full logo: the wordmark
# is three lines of type that are unreadable at 48dp and get clipped by every circular launcher mask.
# tool/icon/ is outside the bundled assets, so this artwork is not shipped inside the APK.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 24
  image_path: "tool/icon/icon_legacy.png"
  adaptive_icon_background: "#F0F4F8"
  adaptive_icon_foreground: "tool/icon/icon_foreground.png"
  # App Store Connect refuses any build whose icons carry an alpha channel, and it refuses it at
  # upload, before review. Every iOS icon in this project had one. This flag makes the generator
  # flatten them, so re-running it can never put the problem back.
  remove_alpha_ios: true
